<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — PDF Booklet</title>
<link rel="alternate" hreflang="en" href="/en/contact.html">
<link rel="alternate" hreflang="sv" href="/sv/contact.html">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared.css">
</head>
<body>

<header>
  <a href="/en/" class="logo">PDF <span>Booklet</span></a>
  <nav>
    <a href="/en/about.html">About</a>
    <a href="/en/policy.html">Policy</a>
    <a href="/en/contact.html" class="active">Contact</a>
    <div class="lang-dropdown" id="langDrop">
      <button class="lang-btn" onclick="toggleLang()">🌐 EN <span class="arrow">▾</span></button>
      <div class="lang-menu">
        <a href="/sv/contact.html">🇸🇪 Svenska</a>
        <a href="/en/contact.html" class="current">🇬🇧 English</a>
      </div>
    </div>
  </nav>
</header>

<div class="page-content">
  <div class="page-label">Contact</div>
  <h1 class="page-title">Get in <em>touch</em></h1>
  <!-- ✏️ Replace the email address below -->
  <p style="color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:40px;">
    Have a question or feedback? Fill in the form below or send an email directly to
    <a href="mailto:your@email.com" style="color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(232,197,71,0.3);">your@email.com</a>.
  </p>
  <div class="divider"></div>

  <form class="contact-form" name="contact-en" method="POST" data-netlify="true" netlify-honeypot="bot-field" onsubmit="handleSubmit(event)">
    <input type="hidden" name="form-name" value="contact-en">
    <input type="hidden" name="bot-field" style="display:none">
    <div class="form-row">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="First Last" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>
    </div>
    <div class="field">
      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" placeholder="What is this about?">
    </div>
    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Write your message here…" required></textarea>
    </div>
    <button type="submit" class="submit-btn">Send message →</button>
    <div class="success-msg" id="successMsg">✓ Thank you! We'll get back to you as soon as possible.</div>
  </form>
</div>

<footer>
  <a href="/en/" class="footer-logo">PDF <span>Booklet</span></a>
  <span class="footer-copy">© 2025</span>
  <div class="footer-links">
    <a href="/en/about.html">About</a>
    <a href="/en/policy.html">Policy</a>
    <a href="/en/contact.html">Contact</a>
  </div>
</footer>

<script>
function toggleLang(){ document.getElementById('langDrop').classList.toggle('open'); }
document.addEventListener('click',function(e){ if(!document.getElementById('langDrop').contains(e.target)) document.getElementById('langDrop').classList.remove('open'); });
function handleSubmit(e){
  if(window.location.hostname==='localhost'||window.location.protocol==='file:'){
    e.preventDefault(); document.getElementById('successMsg').classList.add('visible'); e.target.reset();
  }
}
</script>
</body>
</html>
